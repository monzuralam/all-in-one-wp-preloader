<svg xmlns="http://www.w3.org/2000/svg" width="772" height="250" viewBox="0 0 772 250">
	<defs>
		<linearGradient id="ai1wp-bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#3858e9"/>
			<stop offset="0.55" stop-color="#6c3fd1"/>
			<stop offset="1" stop-color="#9b51e0"/>
		</linearGradient>
		<linearGradient id="ai1wp-accent" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#3858e9"/>
			<stop offset="1" stop-color="#9b51e0"/>
		</linearGradient>
		<filter id="ai1wp-shadow" x="-20%" y="-20%" width="140%" height="150%">
			<feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b1464" flood-opacity="0.35"/>
		</filter>
	</defs>

	<!-- Background -->
	<rect width="772" height="250" fill="url(#ai1wp-bg)"/>
	<circle cx="700" cy="-20" r="150" fill="#fff" fill-opacity="0.06"/>
	<circle cx="420" cy="290" r="120" fill="#fff" fill-opacity="0.05"/>
	<circle cx="40" cy="20" r="60" fill="#fff" fill-opacity="0.05"/>

	<!-- Text -->
	<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" fill="#fff">
		<text x="48" y="94" font-size="44" font-weight="700" letter-spacing="-0.5">All-in-One</text>
		<text x="48" y="144" font-size="44" font-weight="700" letter-spacing="-0.5">WP Preloader</text>
		<text x="50" y="178" font-size="17" fill-opacity="0.88">Beautiful loading screens, no code needed.</text>

		<!-- Pills -->
		<g font-size="13" font-weight="600">
			<rect x="48" y="194" width="86" height="28" rx="14" fill="#fff" fill-opacity="0.16"/>
			<text x="91" y="213" text-anchor="middle">7 designs</text>
			<rect x="142" y="194" width="104" height="28" rx="14" fill="#fff" fill-opacity="0.16"/>
			<text x="194" y="213" text-anchor="middle">Live preview</text>
			<rect x="254" y="194" width="100" height="28" rx="14" fill="#fff" fill-opacity="0.16"/>
			<text x="304" y="213" text-anchor="middle">Lightweight</text>
		</g>
	</g>

	<!-- Browser mockup -->
	<g filter="url(#ai1wp-shadow)">
		<rect x="462" y="34" width="270" height="182" rx="12" fill="#fff"/>
	</g>
	<path d="M474 34h246a12 12 0 0 1 12 12v12h-270v-12a12 12 0 0 1 12-12z" fill="#f2f3f7"/>
	<circle cx="480" cy="46" r="4" fill="#ff5f57"/>
	<circle cx="493" cy="46" r="4" fill="#febc2e"/>
	<circle cx="506" cy="46" r="4" fill="#28c840"/>
	<rect x="520" y="40" width="196" height="12" rx="6" fill="#fff"/>

	<!-- Progress bar -->
	<rect x="462" y="58" width="270" height="3" fill="#e9ebf5"/>
	<rect x="462" y="58" width="150" height="3" fill="url(#ai1wp-accent)"/>

	<!-- Spinner + logo -->
	<circle cx="597" cy="128" r="30" fill="none" stroke="#e9ebf5" stroke-width="6"/>
	<circle cx="597" cy="128" r="30" fill="none" stroke="url(#ai1wp-accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="50 139" transform="rotate(-90 597 128)"/>
	<rect x="585" y="116" width="24" height="24" rx="7" fill="url(#ai1wp-accent)"/>

	<!-- Bouncing dots -->
	<circle cx="581" cy="185" r="5" fill="#3858e9" fill-opacity="0.45"/>
	<circle cx="597" cy="185" r="6.5" fill="#6c3fd1"/>
	<circle cx="613" cy="185" r="5" fill="#9b51e0" fill-opacity="0.45"/>
</svg>
